<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | StatsMaps</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --fond:#fff; --texte:#16191d; --doux:#5b636d; --accent:#1d4ed8; --bordure:#e2e6eb; }
    @media (prefers-color-scheme: dark) {
      :root { --fond:#0e1116; --texte:#e6edf3; --doux:#9aa5b1; --accent:#58a6ff; --bordure:#262c36; }
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:6px; padding:32px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
      background:var(--fond); color:var(--texte); text-align:center; line-height:1.6;
    }
    .code { font-size:64px; font-weight:800; letter-spacing:-0.03em; color:var(--accent); }
    h1 { font-size:22px; margin:0 0 4px; }
    p { color:var(--doux); margin:0 0 22px; max-width:44ch; }
    div { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    a {
      display:inline-block; padding:9px 17px; border-radius:9px;
      border:1px solid var(--bordure); color:var(--accent);
      text-decoration:none; font-weight:600; font-size:14px;
    }
    a:hover { border-color:var(--accent); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>
    Cette adresse n’existe pas, ou plus.<br>
    <span lang="en">This page does not exist, or no longer exists.</span><br>
    <span lang="uk">Ця сторінка не існує або більше не існує.</span>
  </p>
  <div>
    <a href="/">🇫🇷 Accueil</a>
    <a href="/en/" hreflang="en" lang="en">🇬🇧 Home</a>
    <a href="/ua/" hreflang="uk" lang="uk">🇺🇦 Головна</a>
  </div>
</body>
</html>
