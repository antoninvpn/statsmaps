<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StatsMaps — world maps and statistics</title>
  <meta name="description" content="Interactive maps of world statistics: GDP, GDP per capita, growth, inflation and population for 197 countries, from 1980 to 2031, from official IMF data.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://statsmaps.com/en/">
  <link rel="alternate" hreflang="fr" href="https://statsmaps.com/">
  <link rel="alternate" hreflang="en" href="https://statsmaps.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://statsmaps.com/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="StatsMaps — world maps and statistics">
  <meta property="og:description" content="Interactive maps of world statistics: GDP, GDP per capita, growth, inflation and population for 197 countries, from 1980 to 2031, from official IMF data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://statsmaps.com/en/">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body>

  <header class="haut">
    <div class="haut__droite">
      <nav class="haut__langues" aria-label="Language">
        <a href="/" hreflang="fr" lang="fr">Français</a>
        <a href="/en/" hreflang="en" lang="en" aria-current="true">English</a>
      </nav>
      <button class="bouton-icone" id="bouton-theme" type="button"
              aria-label="Switch theme"
              data-vers-clair="Switch to light theme"
              data-vers-sombre="Switch to dark theme">☾</button>
    </div>
  </header>

  <main class="accueil">


    <div class="vignettes">
      <a class="vignette" href="economy/">
        <div class="vignette__pastille">💶</div>
        <div class="vignette__titre">Economy</div>
      </a>
      <a class="vignette" href="demographics/">
        <div class="vignette__pastille">👥</div>
        <div class="vignette__titre">Demographics</div>
      </a>
      <a class="vignette" href="infrastructure/">
        <div class="vignette__pastille">🏗️</div>
        <div class="vignette__titre">Infrastructure</div>
      </a>
      <div class="vignette est-bientot">
        <div class="vignette__pastille">🛡️</div>
        <div class="vignette__titre">Military</div>
      </div>
    </div>
  </main>


  <script src="../assets/js/barre.js"></script>
</body>
</html>
