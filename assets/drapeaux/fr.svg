<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-fr" viewBox="0 0 640 480"><!-- flag-icons 7.6.0 (mêmes couleurs, bandes à 213,3 et 426,7), redessiné pour StatsMaps. Le bleu et le rouge débordent du cadre, et RIEN n'est dessiné dessous au bord : avec du blanc ou du rouge sous le bleu, Safari laisse voir un liseré clair à gauche à certains zooms (85 %, 90 %, 125 %…). Le blanc ne dépasse que d'un cheveu sous chaque couleur, pour qu'il n'y ait pas de jour entre les bandes. -->
