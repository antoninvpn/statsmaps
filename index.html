<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StatsMaps</title>

    <link
        href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.js"></script>

    <script>
        const map = new maplibregl.Map({
            container: 'map',

            style: {
                version: 8,

                sources: {
                    osm: {
                        type: 'raster',
                        tiles: [
                            'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                        ],
                        tileSize: 256,
                        attribution: '© OpenStreetMap contributors'
                    }
                },

                layers: [
                    {
                        id: 'osm',
                        type: 'raster',
                        source: 'osm'
                    }
                ]
            },

            center: [2.35, 48.85],
            zoom: 5
        });

        map.addControl(
            new maplibregl.NavigationControl(),
            'top-right'
        );
    </script>

</body>
</html>
