<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PIB nominal par pays — carte mondiale interactive | StatsMaps</title>
  <meta name="description" content="Carte interactive du PIB nominal de 167 pays, de 1980 à 2031. Données officielles du FMI (World Economic Outlook), classement mondial et évolution année par année.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://statsmaps.com/pib-nominal/">
  <link rel="alternate" hreflang="fr" href="https://statsmaps.com/pib-nominal/">
  <link rel="alternate" hreflang="en" href="https://statsmaps.com/en/gdp/">
  <link rel="alternate" hreflang="x-default" href="https://statsmaps.com/pib-nominal/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="PIB nominal par pays — carte mondiale interactive">
  <meta property="og:description" content="Carte interactive du PIB nominal de 167 pays, de 1980 à 2031. Données officielles du FMI (World Economic Outlook), classement mondial et évolution année par année.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://statsmaps.com/pib-nominal/">
  <link rel="preload" href="../data/pays.geojson" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body class="page-carte" data-indicateur="pib-nominal" data-langue="fr" data-base="../">

  <header class="barre">
    <a class="barre__logo" href="../">Stats<span>Maps</span></a>
    <nav class="barre__nav" aria-label="Cartes">
        <a class="barre__lien" href="../pib-nominal/" aria-current="page"><span class="long">PIB nominal</span><span class="court">PIB</span></a>
        <a class="barre__lien" href="../pib-par-habitant/"><span class="long">PIB par habitant</span><span class="court">PIB/hab.</span></a>
        <a class="barre__lien" href="../croissance/"><span class="long">Croissance</span><span class="court">Croissance</span></a>
    </nav>
    <div class="barre__droite">
      <a class="bouton-icone" href="../en/gdp/" hreflang="en" title="Switch to English">EN</a>
      <button class="bouton-icone" id="bouton-theme" type="button" aria-label="Changer de thème">☾</button>
    </div>
  </header>

  <div class="zone-carte">
    <div id="carte"></div>

    <button class="bouton-icone bouton-panneau" id="bouton-panneau" type="button" aria-expanded="false" aria-controls="panneau"></button>

    <aside class="panneau" id="panneau">
      <div class="panneau__entete">
        <h1 class="panneau__titre" id="titre-panneau">PIB nominal</h1>
        <div class="panneau__soustitre" id="compteur-pays"></div>
        <input class="panneau__recherche" id="recherche" type="search" autocomplete="off" spellcheck="false">
      </div>
      <ul class="classement" id="classement"></ul>
      <div class="panneau__pied" id="source"></div>
    </aside>

    <div class="legende" id="legende"></div>

    <div class="annees">
      <div class="annees__haut">
        <span class="annees__valeur nombre" id="annee-valeur">—</span>
        <span class="annees__etiquette" id="annee-etiquette"></span>
      </div>
      <input type="range" id="curseur-annee" min="1980" max="2031" step="1" value="2025">
      <div class="annees__bornes"><span id="annee-min"></span><span id="annee-max"></span></div>
    </div>

    <div class="chargement" id="chargement">…</div>
  </div>

  <script src="../assets/js/i18n.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.js"></script>
  <script src="../assets/js/carte.js"></script>
</body>
</html>
